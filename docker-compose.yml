services:
  app:
    build: .
    restart: unless-stopped
    ports:
      - "3000:3000"
    # Reads the real .env file at container-start time and injects it as
    # environment variables -- this does NOT copy .env into the image (see
    # .dockerignore); the file only ever needs to exist on the host.
    env_file:
      - .env
    volumes:
      # Named volume, not a bind mount, so the SQLite file (customer
      # identity + conversation state) survives container recreation
      # without depending on a specific host path existing first.
      - nuteco-data:/app/data
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:'+(process.env.PORT||3000)+'/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

volumes:
  nuteco-data:
